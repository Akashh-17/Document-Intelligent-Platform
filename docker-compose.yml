services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    # All keys (GROQ_API_KEY, TAVILY_API_KEY, LANGSMITH_*) come from .env.
    # Don't re-declare them under `environment:` — an unset shell variable
    # there would override the .env value with an empty string.
    env_file:
      - .env
    environment:
      # Keep persisted state inside the mounted volume.
      - CHROMA_DIR=/app/state/chroma_db
      - SQLITE_PATH=/app/state/memory.sqlite
      - UPLOADS_DIR=/app/state/uploads
      # Cache the fastembed model weights in the volume (no re-download on rebuild).
      - FASTEMBED_CACHE_PATH=/app/state/fastembed_cache
    volumes:
      - state:/app/state
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  state:
